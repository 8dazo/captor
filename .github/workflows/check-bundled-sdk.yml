name: Check Bundled SDK

on:
  push:
    branches:
      - 'release/v0.1.0'
    paths:
      - '.github/workflows/check-bundled-sdk.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @captar/types build && pnpm --filter @captar/config build && pnpm --filter @captar/utils build && pnpm --filter @captar/sdk build
      - name: Test bundled pack
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='packages/ts/sdk/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.name='captar';
          j.version='0.5.0';
          j.bundledDependencies=['@captar/config','@captar/types','@captar/utils'];
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE
          cd packages/ts/sdk
          npm pack --json > /tmp/pack.json
          cat /tmp/pack.json
          TARBALL=$(node -e "console.log(require('/tmp/pack.json')[0].filename)")
          tar -tzf "$TARBALL" | grep 'package/node_modules/@captar/'
