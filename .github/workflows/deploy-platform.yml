name: Platform Post-Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-platform.yml'
      - 'apps/platform/**'
      - 'db/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'

jobs:
  post-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10.0.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Confirm deployment ownership
        run: echo "Vercel Git integration owns platform preview and production deployments."
      - name: Run database migrations when configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured in GitHub Actions; skipping migrations."
            echo "Add the DATABASE_URL repository secret to enable automatic production migrations."
            exit 0
          fi
          pnpm exec prisma migrate deploy --schema db/prisma/schema.prisma
