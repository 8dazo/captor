name: Publish v0.1.0

on:
  push:
    branches:
      - 'release/v0.1.0'
    paths:
      - '.github/workflows/create-v0.1.0-tag.yml'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged main commit
        uses: actions/checkout@v4
        with:
          ref: v0.1.0
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Verify external SDK install
        run: node scripts/smoke-sdk-package.mjs

      - name: Verify npm credentials
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish public packages
        run: |
          pnpm --filter @captar/types publish --access public --no-git-checks --provenance
          pnpm --filter @captar/config publish --access public --no-git-checks --provenance
          pnpm --filter @captar/utils publish --access public --no-git-checks --provenance
          pnpm --filter @captar/sdk publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          generate_release_notes: true
