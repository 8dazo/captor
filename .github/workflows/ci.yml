name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Create .env file
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/captar_ci'
          AUTH_SECRET: 'ci-test-secret-not-for-production'
          AUTH_URL: 'http://localhost:3000'

      - name: Test
        run: pnpm test

      - name: Build SDK and bundled helpers
        run: |
          pnpm --filter @captar/types build
          pnpm --filter @captar/config build
          pnpm --filter @captar/utils build
          pnpm --filter captar build

      - name: Verify Captar installs outside the monorepo
        run: node scripts/smoke-sdk-package.mjs
